name: Auto Update IPTV Sources

on:
  schedule:
    # 每天北京时间 08:00 和 20:00 自动运行（对应 UTC 时间 00:00 和 12:00）
    - cron: '0 0,12 * * *'
  # 允许手动点击按钮立即测试运行
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 运行抓取脚本
        run: |
          python rtp/b.py

      - name: 提交并推送更新
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto update iptv sources" && git push)
